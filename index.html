<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>游戏工具箱</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
      color: #fff;
    }

    .wrapper {
      max-width: 520px;
      width: 100%;
    }

    h1 {
      text-align: center;
      margin-bottom: 30px;
      font-size: 28px;
      color: #ffd700;
      text-shadow: 0 0 10px rgba(255, 215, 0, 0.5);
    }

    .tool-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
    }

    .tool-card {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 30px 20px;
      border-radius: 16px;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.12);
      text-decoration: none;
      color: #fff;
      transition: all 0.3s;
    }

    .tool-card:hover {
      background: rgba(255, 255, 255, 0.15);
      border-color: #ffd700;
      transform: translateY(-4px);
      box-shadow: 0 8px 30px rgba(255, 215, 0, 0.15);
    }

    .tool-icon {
      font-size: 48px;
      margin-bottom: 12px;
    }

    .tool-name {
      font-size: 18px;
      font-weight: bold;
      margin-bottom: 6px;
    }

    .tool-desc {
      font-size: 13px;
      color: rgba(255, 255, 255, 0.5);
      text-align: center;
    }

    @media (max-width: 400px) {
      .tool-grid { grid-template-columns: 1fr; }
      body { padding: 16px; }
      h1 { font-size: 22px; margin-bottom: 20px; }
    }
  </style>
</head>
<body>
  <div class="wrapper">
    <h1>游戏工具箱</h1>
    <div class="tool-grid">
      <a class="tool-card" href="./integral.html">
        <div class="tool-icon">🎮</div>
        <div class="tool-name">积分计算器</div>
        <div class="tool-desc">多人对局积分结算与转账方案</div>
      </a>
      <a class="tool-card" href="./matchStatistics.html">
        <div class="tool-icon">🏀</div>
        <div class="tool-name">比赛数据统计</div>
        <div class="tool-desc">篮球比赛数据记录与统计面板</div>
      </a>
    </div>
  </div>
</body>
</html>
